<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Opacity animation for glitch effect -->
    <animate id="glitchOpacity"
      attributeName="opacity"
      values="0.4;0.6;0.4"
      dur="2s"
      repeatCount="indefinite"/>
      
    <!-- Success state transition -->
    <animate id="successFade"
      attributeName="opacity"
      from="0"
      to="1"
      dur="0.5s"
      begin="indefinite"/>
  </defs>

  <!-- Loading State Group -->
  <g id="loadingState">
    <!-- Outer circle with glitch effect -->
    <circle cx="50" cy="50" r="35" 
      stroke="#ff00ff" 
      stroke-width="8" 
      fill="none" 
      opacity="0.4">
      <animate
        attributeName="opacity"
        values="0.4;0.6;0.4"
        dur="2s"
        repeatCount="indefinite"/>
      <animateTransform
        attributeName="transform"
        attributeType="XML"
        type="rotate"
        from="0 50 50"
        to="360 50 50"
        dur="3s"
        repeatCount="indefinite"/>
    </circle>

    <!-- Middle circle with reverse rotation -->
    <circle cx="50" cy="50" r="30" 
      stroke="#00ffff" 
      stroke-width="6" 
      fill="none" 
      opacity="0.6">
      <animate
        attributeName="opacity"
        values="0.6;0.8;0.6"
        dur="1.5s"
        repeatCount="indefinite"/>
      <animateTransform
        attributeName="transform"
        attributeType="XML"
        type="rotate"
        from="360 50 50"
        to="0 50 50"
        dur="2s"
        repeatCount="indefinite"/>
    </circle>

    <!-- Inner circle -->
    <circle cx="50" cy="50" r="25" 
      stroke="#ffffff" 
      stroke-width="4" 
      fill="none">
      <animateTransform
        attributeName="transform"
        attributeType="XML"
        type="rotate"
        from="0 50 50"
        to="360 50 50"
        dur="1.5s"
        repeatCount="indefinite"/>
    </circle>

    <!-- Accent points -->
    <g>
      <circle cx="50" cy="15" r="4" fill="#00ff99"/>
      <circle cx="85" cy="50" r="4" fill="#00ff99"/>
      <circle cx="50" cy="85" r="4" fill="#00ff99"/>
      <circle cx="15" cy="50" r="4" fill="#00ff99"/>
      <animateTransform
        attributeName="transform"
        attributeType="XML"
        type="rotate"
        from="0 50 50"
        to="360 50 50"
        dur="2s"
        repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Success State Group (initially hidden) -->
  <g id="successState" opacity="0">
    <!-- Checkmark animation -->
    <path d="M30,50 L45,65 L75,35" 
      stroke="#ff00ff" 
      stroke-width="8" 
      fill="none" 
      opacity="0.4">
      <animate
        attributeName="opacity"
        values="0.4;0.6;0.4"
        dur="1s"
        repeatCount="3"/>
    </path>
    
    <path d="M32,50 L45,63 L73,35" 
      stroke="#00ffff" 
      stroke-width="6" 
      fill="none" 
      opacity="0.6">
      <animate
        attributeName="opacity"
        values="0.6;0.8;0.6"
        dur="0.8s"
        repeatCount="3"/>
    </path>
    
    <path d="M35,50 L45,60 L70,35" 
      stroke="#ffffff" 
      stroke-width="4" 
      fill="none"/>

    <!-- Success state accent points -->
    <circle cx="35" cy="50" r="4" fill="#00ff99">
      <animate
        attributeName="r"
        values="4;5;4"
        dur="0.5s"
        repeatCount="3"/>
    </circle>
    <circle cx="45" cy="60" r="4" fill="#00ff99">
      <animate
        attributeName="r"
        values="4;5;4"
        dur="0.5s"
        begin="0.2s"
        repeatCount="3"/>
    </circle>
    <circle cx="70" cy="35" r="4" fill="#00ff99">
      <animate
        attributeName="r"
        values="4;5;4"
        dur="0.5s"
        begin="0.4s"
        repeatCount="3"/>
    </circle>
  </g>
</svg>