        <circle cx="240" cy="240" fill="#8be9fd" r="1" />
        <circle cx="320" cy="240" fill="#ff79c6" r="1" />

        <circle cx="80" cy="400" fill="#bd93f9" r="1" />
        <circle cx="160" cy="400" fill="#8be9fd" r="1" />
        <circle cx="240" cy="400" fill="#ff79c6" r="1" />
        <circle cx="320" cy="400" fill="#bd93f9" r="1" />

        <circle cx="80" cy="560" fill="#8be9fd" r="1" />
        <circle cx="160" cy="560" fill="#ff79c6" r="1" />
        <circle cx="240" cy="560" fill="#bd93f9" r="1" />
