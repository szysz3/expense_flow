<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <!-- Glitch effect layers - X shape -->
    <path d="M25,25 L75,75 M75,25 L25,75" opacity="0.4" stroke="#ff00ff" stroke-width="8" />
    <path d="M27,27 L73,73 M73,27 L27,73" opacity="0.6" stroke="#00ffff" stroke-width="6" />

    <!-- Main X shape -->
    <path d="M30,30 L70,70 M70,30 L30,70" stroke="#ffffff" stroke-width="4" />

    <!-- Digital effect on X -->
    <rect fill="#ff00ff" height="4" opacity="0.8" transform="rotate(45 47.5 47.5)" width="5" x="45"
        y="45" />
    <rect fill="#00ffff" height="4" opacity="0.8" transform="rotate(-45 52.5 52.5)" width="5" x="50"
        y="50" />
    <rect fill="#00ff99" height="4" opacity="0.8" transform="rotate(45 42.5 57.5)" width="5" x="40"
        y="55" />

    <!-- Circuit details for X -->
    <line stroke="#00ff99" stroke-width="2" x1="15" x2="30" y1="30" y2="30" />
    <line stroke="#00ff99" stroke-width="2" x1="70" x2="85" y1="30" y2="30" />

    <line stroke="#00ff99" stroke-width="2" x1="15" x2="30" y1="70" y2="70" />
    <line stroke="#00ff99" stroke-width="2" x1="70" x2="85" y1="70" y2="70" />

    <!-- Accent points -->
    <circle cx="30" cy="30" fill="#00ff99" r="3" />
    <circle cx="70" cy="30" fill="#00ff99" r="3" />
    <circle cx="30" cy="70" fill="#00ff99" r="3" />
    <circle cx="70" cy="70" fill="#00ff99" r="3" />
    <circle cx="50" cy="50" fill="#00ff99" r="3" />

    <!-- Digital data flow between X elements -->
    <path d="M35,35 L45,45 M55,55 L65,65" opacity="0.5" stroke="#00ff99" stroke-dasharray="2,3"
        stroke-width="1" />
    <path d="M35,65 L45,55 M55,45 L65,35" opacity="0.5" stroke="#00ff99" stroke-dasharray="2,3"
        stroke-width="1" />

    <!-- Small geometric accents -->
    <rect fill="#ff00ff" height="5" opacity="0.3" transform="rotate(45 22.5 22.5)" width="5" x="20"
        y="20" />
    <rect fill="#00ffff" height="5" opacity="0.3" transform="rotate(-45 77.5 77.5)" width="5" x="75"
        y="75" />
</svg>