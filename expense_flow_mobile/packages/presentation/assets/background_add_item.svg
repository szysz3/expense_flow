    <rect fill="#50fa7b" height="2" opacity="0.25" width="5" x="174" y="102" />
    <rect fill="#8be9fd" height="4" opacity="0.3" width="4" x="155" y="636" />
    <rect fill="#ff79c6" height="2" opacity="0.2" width="6" x="235" y="648" />
    <rect fill="#50fa7b" height="5" opacity="0.25" width="2" x="195" y="670" />

