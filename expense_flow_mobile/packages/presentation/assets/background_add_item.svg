    <circle cx="325" cy="252" fill="#8be9fd" opacity="0.4" r="2" />
    <circle cx="65" cy="592" fill="#8be9fd" opacity="0.4" r="2" />
    <circle cx="325" cy="592" fill="#ff79c6" opacity="0.4" r="2" />

