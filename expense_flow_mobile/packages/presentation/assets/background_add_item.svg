    <line opacity="0.3" stroke="#50fa7b" stroke-width="1" x1="265" x2="325" y1="252" y2="252" />
    <line opacity="0.3" stroke="#50fa7b" stroke-width="1" x1="65" x2="125" y1="592" y2="592" />
