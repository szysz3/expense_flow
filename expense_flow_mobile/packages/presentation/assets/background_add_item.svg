    <line opacity="0.3" stroke="#50fa7b" stroke-width="2" x1="105" x2="285" y1="422" y2="422" />

    <!-- Digital noise dots scattered around -->
    <circle cx="110" cy="342" fill="#8be9fd" opacity="0.2" r="1" />
    <circle cx="280" cy="402" fill="#ff79c6" opacity="0.2" r="1" />
    <circle cx="195" cy="422" fill="#50fa7b" opacity="0.2" r="1" />
    <circle cx="150" cy="512" fill="#8be9fd" opacity="0.2" r="1" />
    <circle cx="240" cy="332" fill="#ff79c6" opacity="0.2" r="1" />
</svg>