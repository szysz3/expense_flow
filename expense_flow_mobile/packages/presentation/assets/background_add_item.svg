    <path d="M25,300 L40,300" opacity="0.2" stroke="#50fa7b" stroke-width="1" />
    <path d="M25,310 L35,310" opacity="0.3" stroke="#50fa7b" stroke-width="1" />
    <path d="M25,320 L38,320" opacity="0.2" stroke="#50fa7b" stroke-width="1" />

    <path d="M365,300 L350,300" opacity="0.2" stroke="#50fa7b" stroke-width="1" />
    <path d="M365,310 L355,310" opacity="0.3" stroke="#50fa7b" stroke-width="1" />
    <path d="M365,320 L352,320" opacity="0.2" stroke="#50fa7b" stroke-width="1" />

