<svg viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg">
    <!-- Transparent background -->
    <rect fill="transparent" height="844" width="390" />

    <!-- Ambient grid pattern - keeping this as a primary structural element -->
    <g opacity="0.08">
        <path d="M0 80 L390 80" stroke="#8a8d96" stroke-width="1" />
        <path d="M0 160 L390 160" stroke="#8a8d96" stroke-width="1" />
        <path d="M0 240 L390 240" stroke="#8a8d96" stroke-width="1" />
        <path d="M0 320 L390 320" stroke="#8a8d96" stroke-width="1" />
        <path d="M0 400 L390 400" stroke="#8a8d96" stroke-width="1" />
        <path d="M0 480 L390 480" stroke="#8a8d96" stroke-width="1" />
        <path d="M0 560 L390 560" stroke="#8a8d96" stroke-width="1" />
        <path d="M0 640 L390 640" stroke="#8a8d96" stroke-width="1" />
        <path d="M0 720 L390 720" stroke="#8a8d96" stroke-width="1" />
        <path d="M0 800 L390 800" stroke="#8a8d96" stroke-width="1" />

        <path d="M80 0 L80 844" stroke="#8a8d96" stroke-width="1" />
        <path d="M160 0 L160 844" stroke="#8a8d96" stroke-width="1" />
        <path d="M240 0 L240 844" stroke="#8a8d96" stroke-width="1" />
        <path d="M320 0 L320 844" stroke="#8a8d96" stroke-width="1" />
    </g>

    <!-- Reduced circuit pattern - kept only two main paths -->
    <path d="M20,200 L60,200 L60,240 L100,240 L100,280 L140,280 L140,320" fill="none" opacity="0.15"
        stroke="#8be9fd" stroke-width="2" />
    <path d="M370,600 L330,600 L330,560 L290,560 L290,520 L250,520 L250,480" fill="none"
        opacity="0.15" stroke="#8be9fd" stroke-width="2" />

    <!-- Circuit connection lines - reduced to just two -->
    <line opacity="0.25" stroke="#50fa7b" stroke-width="1" x1="65" x2="125" y1="252" y2="252" />
    <line opacity="0.25" stroke="#50fa7b" stroke-width="1" x1="265" x2="325" y1="592" y2="592" />

    <!-- Connector nodes - reduced to just two -->
    <circle cx="125" cy="252" fill="#50fa7b" opacity="0.25" r="3" />
    <circle cx="265" cy="592" fill="#50fa7b" opacity="0.25" r="3" />

    <!-- Static line (central feature) -->
    <line opacity="0.3" stroke="#50fa7b" stroke-width="2" x1="105" x2="285" y1="422" y2="422" />

    <!-- Status indicators - kept just one set -->
    <circle cx="30" cy="220" fill="#50fa7b" opacity="0.2" r="4" />
    <circle cx="30" cy="240" fill="#8be9fd" opacity="0.2" r="4" />
    <circle cx="30" cy="260" fill="#ff79c6" opacity="0.2" r="4" />

    <!-- Digital noise - reduced to just three elements -->
    <rect fill="#8be9fd" height="3" opacity="0.2" width="3" x="195" y="120" />
    <rect fill="#ff79c6" height="8" opacity="0.15" width="2" x="216" y="95" />
    <rect fill="#50fa7b" height="2" opacity="0.2" width="5" x="174" y="102" />
</svg>