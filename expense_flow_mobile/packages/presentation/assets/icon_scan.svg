<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Glitch effects -->
  <rect x="15" y="15" width="70" height="70" stroke="#ff00ff" stroke-width="8" fill="none" opacity="0.4"/>
  <rect x="17" y="17" width="66" height="66" stroke="#00ffff" stroke-width="6" fill="none" opacity="0.6"/>
  <!-- Main shape -->
  <rect x="20" y="20" width="60" height="60" stroke="#ffffff" stroke-width="6" fill="none"/>
  <!-- Scanning line -->
  <line x1="25" y1="50" x2="75" y2="50" stroke="#00ff99" stroke-width="2"/>
  <!-- Corner accents -->
  <circle cx="20" cy="20" r="4" fill="#00ff99"/>
  <circle cx="80" cy="80" r="4" fill="#00ff99"/>
  <!-- Circuit details -->
  <line x1="10" y1="20" x2="20" y2="20" stroke="#00ff99" stroke-width="2"/>
  <line x1="80" y1="80" x2="90" y2="80" stroke="#00ff99" stroke-width="2"/>
</svg>