<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <!-- Background with soft rounded corners -->
    <!--    <rect fill="#44475A" height="480" rx="80" ry="80" width="480" x="16" y="16" />-->

    <!-- Glitch effect layers -->
    <rect fill="none" height="320" opacity="0.4" rx="40" ry="40" stroke="#ff00ff" stroke-width="24"
        width="320" x="96" y="96" />
    <rect fill="none" height="288" opacity="0.6" rx="36" ry="36" stroke="#00ffff" stroke-width="20"
        width="288" x="112" y="112" />

    <!-- Main geometric shape (stylized C or circuit) -->
    <path d="M136,136 L376,136 L376,376 L136,376 L136,256 L320,256" fill="none" stroke="#ffffff"
        stroke-linecap="round" stroke-linejoin="round" stroke-width="24" />

    <!-- Accent elements -->
    <circle cx="136" cy="136" fill="#00ff99" r="24" />
    <circle cx="376" cy="376" fill="#00ff99" r="24" />

    <!-- Additional circuit details -->
    <line stroke="#00ff99" stroke-linecap="round" stroke-width="12" x1="88" x2="136" y1="136"
        y2="136" />
    <line stroke="#00ff99" stroke-linecap="round" stroke-width="12" x1="376" x2="424" y1="376"
        y2="376" />

    <!-- Center scanning line -->
    <line stroke="#00ff99" stroke-linecap="round" stroke-width="12" x1="240" x2="320" y1="200"
        y2="200" />
    <line stroke="#00ff99" stroke-linecap="round" stroke-width="12" x1="240" x2="320" y1="312"
        y2="312" />

    <!-- Small graphic element to add balance -->
    <circle cx="256" cy="256" fill="#00ff99" r="12" />
</svg>