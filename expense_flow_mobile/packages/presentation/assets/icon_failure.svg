<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <!-- Glitch effect layers -->
    <path d="M30,30 L70,70 M70,30 L30,70" fill="none" opacity="0.4" stroke="#ff00ff"
        stroke-width="8" />
    <path d="M32,32 L68,68 M68,32 L32,68" fill="none" opacity="0.6" stroke="#00ffff"
        stroke-width="6" />

    <!-- Main X shape -->
    <path d="M35,35 L65,65 M65,35 L35,65" fill="none" stroke="#ffffff" stroke-width="6" />

    <!-- Border frame with glitch effect -->
    <rect fill="none" height="70" opacity="0.5" stroke="#ff00ff" stroke-width="3" width="70" x="15"
        y="15" />
    <rect fill="none" height="66" opacity="0.7" stroke="#00ffff" stroke-width="2" width="66" x="17"
        y="17" />

    <!-- Cyberpunk decorative elements -->
    <circle cx="35" cy="35" fill="#00ff99" r="4" />
    <circle cx="65" cy="65" fill="#00ff99" r="4" />
    <circle cx="35" cy="65" fill="#00ff99" r="4" />
    <circle cx="65" cy="35" fill="#00ff99" r="4" />

    <!-- Circuit-like details -->
    <line stroke="#00ff99" stroke-width="2" x1="5" x2="15" y1="35" y2="35" />
    <line stroke="#00ff99" stroke-width="2" x1="85" x2="95" y1="65" y2="65" />
    <line stroke="#ff00ff" stroke-width="2" x1="65" x2="65" y1="5" y2="15" />
    <line stroke="#00ffff" stroke-width="2" x1="35" x2="35" y1="85" y2="95" />

    <!-- Additional geometric elements -->
    <rect fill="#ff00ff" height="10" opacity="0.3" transform="rotate(45 50 50)" width="10" x="45"
        y="45" />

    <!-- Warning element in center -->
    <path d="M50,25 L55,35 L45,35 Z" fill="#00ff99" opacity="0.8" />
</svg>