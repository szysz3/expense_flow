<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <!-- Glitch effect layers - receipt outline -->
    <path d="M30,20 L70,20 L70,80 L60,70 L50,80 L40,70 L30,80 Z" fill="none" opacity="0.4"
        stroke="#ff00ff" stroke-width="8" />
    <path d="M32,22 L68,22 L68,78 L60,70 L50,78 L40,70 L32,78 Z" fill="none" opacity="0.6"
        stroke="#00ffff" stroke-width="6" />

    <!-- Main receipt outline -->
    <path d="M35,25 L65,25 L65,75 L60,70 L50,75 L40,70 L35,75 Z" fill="none" stroke="#ffffff"
        stroke-width="4" />

    <!-- Error X -->
    <path d="M43,43 L57,57 M57,43 L43,57" stroke="#ff00ff" stroke-width="4" />
    <path d="M45,45 L55,55 M55,45 L45,55" stroke="#ffffff" stroke-width="2" />

    <!-- Circuit-like details -->
    <line stroke="#00ff99" stroke-width="2" x1="35" x2="65" y1="35" y2="35" />
    <line stroke="#00ff99" stroke-width="2" x1="35" x2="65" y1="65" y2="65" />

    <!-- Error indicators -->
    <circle cx="40" cy="50" fill="#ff00ff" r="2" />
    <circle cx="60" cy="50" fill="#ff00ff" r="2" />
</svg>