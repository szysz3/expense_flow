<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <!-- Glitch effect layers - three lines -->
    <path d="M25,30 L75,30 M25,50 L75,50 M25,70 L75,70" opacity="0.4" stroke="#ff00ff"
        stroke-width="8" />
    <path d="M27,32 L73,32 M27,52 L73,52 M27,72 L73,72" opacity="0.6" stroke="#00ffff"
        stroke-width="6" />

    <!-- Main three lines -->
    <path d="M30,35 L70,35 M30,55 L70,55 M30,75 L70,75" stroke="#ffffff" stroke-width="4" />

    <!-- Digital effect on lines -->
    <rect fill="#ff00ff" height="4" opacity="0.8" width="5" x="40" y="33" />
    <rect fill="#00ffff" height="4" opacity="0.8" width="5" x="60" y="53" />
    <rect fill="#00ff99" height="4" opacity="0.8" width="5" x="50" y="73" />

    <!-- Circuit details for each line -->
    <line stroke="#00ff99" stroke-width="2" x1="15" x2="30" y1="35" y2="35" />
    <line stroke="#00ff99" stroke-width="2" x1="70" x2="85" y1="35" y2="35" />

    <line stroke="#00ff99" stroke-width="2" x1="15" x2="30" y1="55" y2="55" />
    <line stroke="#00ff99" stroke-width="2" x1="70" x2="85" y1="55" y2="55" />

    <line stroke="#00ff99" stroke-width="2" x1="15" x2="30" y1="75" y2="75" />
    <line stroke="#00ff99" stroke-width="2" x1="70" x2="85" y1="75" y2="75" />

    <!-- Accent points -->
    <circle cx="30" cy="35" fill="#00ff99" r="3" />
    <circle cx="70" cy="35" fill="#00ff99" r="3" />

    <circle cx="30" cy="55" fill="#00ff99" r="3" />
    <circle cx="70" cy="55" fill="#00ff99" r="3" />

    <circle cx="30" cy="75" fill="#00ff99" r="3" />
    <circle cx="70" cy="75" fill="#00ff99" r="3" />

    <!-- Digital data flow between lines -->
    <path d="M35,35 L35,55 M45,55 L45,75" opacity="0.5" stroke="#00ff99" stroke-dasharray="2,3"
        stroke-width="1" />
    <path d="M65,35 L65,55 M55,55 L55,75" opacity="0.5" stroke="#00ff99" stroke-dasharray="2,3"
        stroke-width="1" />

    <!-- Small geometric accent -->
    <rect fill="#ff00ff" height="5" opacity="0.3" transform="rotate(45 22.5 27.5)" width="5" x="20"
        y="25" />
</svg>