<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <!-- Glitch effect layers - bar chart base -->
    <path d="M20,80 L80,80 M20,20 L20,80" fill="none" opacity="0.4" stroke="#ff00ff"
        stroke-width="8" />
    <path d="M22,78 L78,78 M22,22 L22,78" fill="none" opacity="0.6" stroke="#00ffff"
        stroke-width="6" />

    <!-- Main axes lines -->
    <path d="M25,75 L75,75 M25,25 L25,75" fill="none" stroke="#ffffff" stroke-width="4" />

    <!-- Bar chart bars with glitch effects -->
    <rect fill="#ff00ff" height="30" opacity="0.4" width="8" x="30" y="45" />
    <rect fill="#00ffff" height="28" opacity="0.6" width="4" x="32" y="47" />
    <rect fill="#ffffff" height="25" width="10" x="35" y="50" />

    <rect fill="#ff00ff" height="45" opacity="0.4" width="8" x="50" y="30" />
    <rect fill="#00ffff" height="43" opacity="0.6" width="4" x="52" y="32" />
    <rect fill="#ffffff" height="40" width="10" x="55" y="35" />

    <rect fill="#ff00ff" height="20" opacity="0.4" width="8" x="70" y="55" />
    <rect fill="#00ffff" height="18" opacity="0.6" width="4" x="72" y="57" />
    <rect fill="#ffffff" height="15" width="10" x="75" y="60" />

    <!-- Circuit details -->
    <line stroke="#00ff99" stroke-width="2" x1="15" x2="25" y1="75" y2="75" />
    <line stroke="#00ff99" stroke-width="2" x1="25" x2="25" y1="15" y2="25" />

    <!-- Accent points -->
    <circle cx="25" cy="75" fill="#00ff99" r="4" />
    <circle cx="35" cy="50" fill="#00ff99" r="3" />
    <circle cx="55" cy="35" fill="#00ff99" r="3" />
    <circle cx="75" cy="60" fill="#00ff99" r="3" />

    <!-- Data point connections -->
    <line opacity="0.7" stroke="#00ff99" stroke-width="1" x1="40" x2="55" y1="50" y2="35" />
    <line opacity="0.7" stroke="#00ff99" stroke-width="1" x1="65" x2="75" y1="35" y2="60" />
</svg>