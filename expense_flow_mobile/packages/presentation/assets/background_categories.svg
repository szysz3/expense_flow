<svg viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg">
    <!-- Transparent background -->
    <rect fill="transparent" height="844" width="390" />

    <!-- Ambient grid pattern - keeping main structure -->
    <g opacity="0.08">
        <path d="M0 80 L390 80" stroke="#8a8d96" stroke-width="1" />
        <path d="M0 160 L390 160" stroke="#8a8d96" stroke-width="1" />
        <path d="M0 240 L390 240" stroke="#8a8d96" stroke-width="1" />
        <path d="M0 320 L390 320" stroke="#8a8d96" stroke-width="1" />
        <path d="M0 400 L390 400" stroke="#8a8d96" stroke-width="1" />
        <path d="M0 480 L390 480" stroke="#8a8d96" stroke-width="1" />
        <path d="M0 560 L390 560" stroke="#8a8d96" stroke-width="1" />
        <path d="M0 640 L390 640" stroke="#8a8d96" stroke-width="1" />
        <path d="M0 720 L390 720" stroke="#8a8d96" stroke-width="1" />
        <path d="M0 800 L390 800" stroke="#8a8d96" stroke-width="1" />

        <path d="M80 0 L80 844" stroke="#8a8d96" stroke-width="1" />
        <path d="M160 0 L160 844" stroke="#8a8d96" stroke-width="1" />
        <path d="M240 0 L240 844" stroke="#8a8d96" stroke-width="1" />
        <path d="M320 0 L320 844" stroke="#8a8d96" stroke-width="1" />
    </g>

    <!-- Reduced dotted grid overlay - only at key intersections -->
    <g opacity="0.05">
        <circle cx="160" cy="160" fill="#8a8d96" r="1" />
        <circle cx="160" cy="320" fill="#8a8d96" r="1" />
        <circle cx="160" cy="480" fill="#8a8d96" r="1" />
        <circle cx="160" cy="640" fill="#8a8d96" r="1" />

        <circle cx="240" cy="160" fill="#8a8d96" r="1" />
        <circle cx="240" cy="320" fill="#8a8d96" r="1" />
        <circle cx="240" cy="480" fill="#8a8d96" r="1" />
        <circle cx="240" cy="640" fill="#8a8d96" r="1" />
    </g>
    
    <!-- Reduced diagonal paths - only two -->
    <g opacity="0.12">
        <path d="M110,150 L150,190" fill="none" stroke="#50fa7b" stroke-dasharray="4,4"
            stroke-width="1" />
        <path d="M280,694 L240,654" fill="none" stroke="#50fa7b" stroke-dasharray="4,4"
            stroke-width="1" />
    </g>

    <!-- Kept central element - simplified hexagon -->
    <g opacity="0.15">
        <path d="M175,390 L215,390 L235,422 L215,454 L175,454 L155,422 Z" fill="none"
            stroke="#bd93f9" stroke-width="1" />
        <line stroke="#bd93f9" stroke-dasharray="2,2" stroke-width="1" x1="155" x2="235" y1="422"
            y2="422" />
    </g>

    <!-- Reduced status indicators - only one set -->
    <g opacity="0.15">
        <circle cx="45" cy="280" fill="#8be9fd" r="3" />
        <circle cx="45" cy="290" fill="#50fa7b" r="3" />
        <circle cx="45" cy="300" fill="#ff79c6" r="3" />
    </g>

    <!-- Minimal digital noise - just four elements -->
    <g opacity="0.08">
        <rect fill="#8be9fd" height="3" width="3" x="95" y="105" />
        <rect fill="#ff79c6" height="3" width="3" x="292" y="736" />
        <rect fill="#50fa7b" height="2" width="2" x="180" y="320" />
        <rect fill="#50fa7b" height="2" width="2" x="208" y="524" />
    </g>
</svg>