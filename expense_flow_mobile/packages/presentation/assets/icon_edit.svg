<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <!-- Glitch effect layers for document -->
    <path d="M25,20 L60,20 L75,35 L75,80 L25,80 Z" fill="none" opacity="0.4" stroke="#ff00ff"
        stroke-width="8" />
    <path d="M27,22 L58,22 L73,37 L73,78 L27,78 Z" fill="none" opacity="0.6" stroke="#00ffff"
        stroke-width="6" />

    <!-- Main document shape -->
    <path d="M30,25 L55,25 L70,40 L70,75 L30,75 Z" fill="none" stroke="#ffffff" stroke-width="4" />

    <!-- Document corner fold -->
    <path d="M55,25 L55,40 L70,40" fill="none" stroke="#ffffff" stroke-width="4" />
    <path d="M58,28 L58,37 L67,37" fill="none" opacity="0.6" stroke="#00ffff" stroke-width="1" />

    <!-- Text lines (being edited) -->
    <line opacity="0.8" stroke="#ffffff" stroke-width="2" x1="35" x2="65" y1="50" y2="50" />
    <line opacity="0.8" stroke="#ffffff" stroke-width="2" x1="35" x2="57" y1="58" y2="58" />
    <line opacity="0.8" stroke="#ffffff" stroke-width="2" x1="35" x2="61" y1="66" y2="66" />

    <!-- Cursor/insertion point with glitch effect -->
    <rect fill="#ff00ff" height="6" opacity="0.8" width="2" x="57" y="56" />
    <rect fill="#00ffff" height="8" opacity="0.6" width="2" x="58" y="55" />
    <rect fill="#ffffff" height="10" width="2" x="59" y="54" />

    <!-- Circuit details -->
    <line stroke="#00ff99" stroke-width="2" x1="20" x2="30" y1="40" y2="40" />
    <line stroke="#00ff99" stroke-width="2" x1="70" x2="80" y1="60" y2="60" />
    <line stroke="#00ff99" stroke-width="2" x1="50" x2="50" y1="75" y2="85" />

    <!-- Accent points -->
    <circle cx="30" cy="25" fill="#00ff99" r="3" />
    <circle cx="70" cy="40" fill="#00ff99" r="3" />
    <circle cx="30" cy="75" fill="#00ff99" r="3" />
    <circle cx="70" cy="75" fill="#00ff99" r="3" />

    <!-- Edit mode indicators -->
    <path d="M65,30 L67,32 M70,35 L72,37" stroke="#00ff99" stroke-linecap="round"
        stroke-width="1.5" />
    <rect fill="#00ff99" height="4" opacity="0.7" width="4" x="38" y="48" />

    <!-- Digital data flow -->
    <path d="M35,35 L65,35 M35,42 L55,42" opacity="0.5" stroke="#00ff99" stroke-dasharray="2,3"
        stroke-width="1" />

    <!-- Pencil element -->
    <path d="M80,25 L85,30 L65,50 L60,45 Z" fill="none" stroke="#ffffff" stroke-width="2" />
    <path d="M82,27 L85,30 L65,50 L62,47 Z" fill="none" opacity="0.4" stroke="#ff00ff"
        stroke-width="1" />

    <!-- Geometric accent -->
    <rect fill="#ff00ff" height="5" opacity="0.3" transform="rotate(45 25 20)" width="5" x="22.5"
        y="17.5" />
</svg>