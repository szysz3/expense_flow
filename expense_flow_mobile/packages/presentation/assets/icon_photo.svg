<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Glitch effects -->
  <path d="M20,30 L80,30 L80,70 L20,70 Z" stroke="#ff00ff" stroke-width="8" fill="none" opacity="0.4"/>
  <path d="M22,32 L78,32 L78,68 L22,68 Z" stroke="#00ffff" stroke-width="6" fill="none" opacity="0.6"/>
  
  <!-- Main camera body -->
  <path d="M25,35 L75,35 L75,65 L25,65 Z" stroke="#ffffff" stroke-width="6" fill="none"/>
  
  <!-- Lens circle glitch -->
  <circle cx="50" cy="50" r="15" stroke="#ff00ff" stroke-width="8" fill="none" opacity="0.4"/>
  <circle cx="50" cy="50" r="13" stroke="#00ffff" stroke-width="6" fill="none" opacity="0.6"/>
  
  <!-- Main lens -->
  <circle cx="50" cy="50" r="12" stroke="#ffffff" stroke-width="6" fill="none"/>
  
  <!-- Circuit details -->
  <line x1="10" y1="35" x2="25" y2="35" stroke="#00ff99" stroke-width="2"/>
  <line x1="75" y1="65" x2="90" y2="65" stroke="#00ff99" stroke-width="2"/>
  
  <!-- Accent points -->
  <circle cx="25" cy="35" r="4" fill="#00ff99"/>
  <circle cx="75" cy="65" r="4" fill="#00ff99"/>
  <circle cx="50" cy="50" r="4" fill="#00ff99"/>
  
  <!-- Corner accents -->
  <rect x="20" y="30" width="8" height="8" fill="#ff00ff" opacity="0.3" transform="rotate(45 24 34)"/>
  <rect x="72" y="62" width="8" height="8" fill="#00ffff" opacity="0.3" transform="rotate(45 76 66)"/>
</svg>