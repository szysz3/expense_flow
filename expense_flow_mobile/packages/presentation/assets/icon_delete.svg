<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <!-- Glitch effect layers for trash can -->
    <path d="M25,30 L35,30 L40,25 L60,25 L65,30 L75,30 L75,80 L25,80 Z" fill="none"
        opacity="0.4" stroke="#ff00ff" stroke-width="8" />
    <path d="M27,32 L36,32 L41,27 L59,27 L64,32 L73,32 L73,78 L27,78 Z" fill="none"
        opacity="0.6" stroke="#00ffff" stroke-width="6" />

    <!-- Main trash can shape -->
    <path d="M30,35 L38,35 L43,30 L57,30 L62,35 L70,35 L70,75 L30,75 Z" fill="none"
        stroke="#ffffff" stroke-width="4" />

    <!-- Delete bars (X) inside with glitch effect -->
    <path d="M40,45 L60,65" opacity="0.4" stroke="#ff00ff" stroke-width="6" />
    <path d="M42,47 L58,63" opacity="0.6" stroke="#00ffff" stroke-width="4" />
    <path d="M45,50 L55,60" stroke="#ffffff" stroke-width="2" />

    <path d="M60,45 L40,65" opacity="0.4" stroke="#ff00ff" stroke-width="6" />
    <path d="M58,47 L42,63" opacity="0.6" stroke="#00ffff" stroke-width="4" />
    <path d="M55,50 L45,60" stroke="#ffffff" stroke-width="2" />

    <!-- Circuit details -->
    <line stroke="#00ff99" stroke-width="2" x1="15" x2="30" y1="35" y2="35" />
    <line stroke="#00ff99" stroke-width="2" x1="70" x2="85" y1="35" y2="35" />
    <line stroke="#00ff99" stroke-width="2" x1="50" x2="50" y1="75" y2="85" />

    <!-- Accent points -->
    <circle cx="30" cy="35" fill="#00ff99" r="3" />
    <circle cx="70" cy="35" fill="#00ff99" r="3" />
    <circle cx="50" cy="75" fill="#00ff99" r="3" />
    <circle cx="50" cy="50" fill="#00ff99" r="2" />

    <!-- Small geometric accent -->
    <rect fill="#00ff99" height="3" opacity="0.7" width="10" x="45" y="25" />

    <!-- Digital glitch effect -->
    <rect fill="#ff00ff" height="4" opacity="0.8" width="4" x="35" y="55" />
    <rect fill="#00ffff" height="5" opacity="0.8" width="3" x="62" y="45" />
</svg>