<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <!-- Glitch effect layers -->
    <circle cx="50" cy="50" fill="none" opacity="0.4" r="22" stroke="#ff00ff" stroke-width="3" />
    <circle cx="52" cy="48" fill="none" opacity="0.6" r="22" stroke="#00ffff" stroke-width="3" />

    <!-- Main gear outline -->
    <circle cx="50" cy="50" fill="none" r="20" stroke="#ffffff" stroke-width="3" />

    <!-- Gear teeth -->
    <rect fill="#ffffff" height="12" width="4" x="48" y="15" />
    <rect fill="#ffffff" height="12" width="4" x="48" y="73" />
    <rect fill="#ffffff" height="4" width="12" x="15" y="48" />
    <rect fill="#ffffff" height="4" width="12" x="73" y="48" />

    <!-- Diagonal gear teeth with glitch effect -->
    <rect fill="#ffffff" height="4" transform="rotate(45 26 26)" width="10" x="26" y="26" />
    <rect fill="#ffffff" height="4" transform="rotate(45 74 74)" width="10" x="74" y="74" />
    <rect fill="#ffffff" height="4" transform="rotate(-45 26 74)" width="10" x="26" y="74" />
    <rect fill="#ffffff" height="4" transform="rotate(-45 74 26)" width="10" x="74" y="26" />

    <!-- Center hole with cyberpunk accents -->
    <circle cx="50" cy="50" fill="none" r="8" stroke="#00ff99" stroke-width="2" />
    <circle cx="50" cy="50" fill="none" opacity="0.5" r="10" stroke="#ff00ff" stroke-width="1" />

    <!-- Scanning line -->
    <line stroke="#00ff99" stroke-width="1" x1="35" x2="65" y1="50" y2="50" />

    <!-- Circuit-like details -->
    <circle cx="50" cy="50" fill="#00ff99" r="4" />

    <!-- Additional cyberpunk details -->
    <line stroke="#00ffff" stroke-width="1" x1="50" x2="50" y1="38" y2="42" />
    <line stroke="#00ffff" stroke-width="1" x1="50" x2="50" y1="58" y2="62" />
    <line stroke="#ff00ff" stroke-width="1" x1="38" x2="42" y1="50" y2="50" />
    <line stroke="#ff00ff" stroke-width="1" x1="58" x2="62" y1="50" y2="50" />
</svg>