<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Glitch effects -->
  <path d="M25,20 L75,20 L75,80 L25,80 Z" stroke="#ff00ff" stroke-width="8" fill="none" opacity="0.4"/>
  <path d="M27,22 L73,22 L73,78 L27,78 Z" stroke="#00ffff" stroke-width="6" fill="none" opacity="0.6"/>
  
  <!-- Main receipt shape -->
  <path d="M30,25 L70,25 L70,75 L30,75 Z" stroke="#ffffff" stroke-width="6" fill="none"/>
  
  <!-- Receipt lines glitch -->
  <line x1="35" y1="35" x2="65" y2="35" stroke="#ff00ff" stroke-width="4" opacity="0.4"/>
  <line x1="35" y1="45" x2="65" y2="45" stroke="#00ffff" stroke-width="4" opacity="0.6"/>
  
  <!-- Receipt lines -->
  <line x1="35" y1="40" x2="65" y2="40" stroke="#ffffff" stroke-width="3"/>
  <line x1="35" y1="50" x2="65" y2="50" stroke="#ffffff" stroke-width="3"/>
  <line x1="35" y1="60" x2="55" y2="60" stroke="#ffffff" stroke-width="3"/>
  
  <!-- Scanning line -->
  <line x1="30" y1="50" x2="70" y2="50" stroke="#00ff99" stroke-width="2">
    <animate attributeName="y1" values="30;70;30" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="30;70;30" dur="2s" repeatCount="indefinite"/>
  </line>
  
  <!-- Circuit details -->
  <line x1="15" y1="25" x2="30" y2="25" stroke="#00ff99" stroke-width="2"/>
  <line x1="70" y1="75" x2="85" y2="75" stroke="#00ff99" stroke-width="2"/>
  
  <!-- Accent points -->
  <circle cx="30" cy="25" r="4" fill="#00ff99"/>
  <circle cx="70" cy="75" r="4" fill="#00ff99"/>
  
  <!-- Corner accents -->
  <rect x="25" y="20" width="8" height="8" fill="#ff00ff" opacity="0.3" transform="rotate(45 29 24)"/>
  <rect x="67" y="72" width="8" height="8" fill="#00ffff" opacity="0.3" transform="rotate(45 71 76)"/>
</svg>