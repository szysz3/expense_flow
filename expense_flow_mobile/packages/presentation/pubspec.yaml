name: presentation
description: "A new Flutter package project."
version: 0.0.1
publish_to: none
homepage:

environment:
  sdk: ^3.6.1
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  domain:
    path: ../domain
  data:
    path: ../data
  flutter_bloc: ^9.0.0
  bloc: ^9.0.0
  camera: ^0.10.5+9
  freezed_annotation: ^2.4.4
  freezed: ^2.5.8
  flutter_svg: ^2.0.17
  vibration: ^1.8.4
  get_it: ^7.6.7
  injectable: ^2.3.2
  uuid: ^4.2.1
  dartz: ^0.10.1
  dio: ^5.0.0
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  injectable_generator: ^2.4.1

