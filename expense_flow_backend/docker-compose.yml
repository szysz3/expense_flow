version: '3.8'

services:
  expense-flow:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./.data:/app/.data
    environment:
      - AZURE_DOCUMENT_ENDPOINT
      - AZURE_DOCUMENT_KEY
      - CHATGPT_KEY
      - EXPENSE_FLOW_API_KEY
      - MAX_RETRIES=3
      - RETRY_DELAY=1.0
      - DB_PATH=/app/.data/serve/receipts.db
      - TEMP_DB_PATH=/app/.data/serve/temp_receipts.db
      - OLLAMA_HOST=http://localhost:11434
      - OLLAMA_MODEL=hf.co/speakleash/Bielik-11B-v2.3-Instruct-GGUF:Q6_K_low_temp
      - OLLAMA_FALLBACK_MODEL=hf.co/unsloth/phi-4-GGUF:Q5_K_M
      - PYTHONPATH=/app
    deploy:
      resources:
        limits:
          memory: 32G
        reservations:
          memory: 2G
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/docs')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped